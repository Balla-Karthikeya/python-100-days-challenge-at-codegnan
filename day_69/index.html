<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Template</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="container">
    <h2 class="logo">MySite</h2>

    <ul class="nav-links" id="navLinks">
      <li><a href="#">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <div class="menu-toggle" id="menuToggle">
      ☰
    </div>
  </div>
</nav>

<!-- Hero Section -->
<section class="hero">
  <div class="container">
    <h1>Welcome to My Website</h1>
    <p>Build responsive websites easily</p>
    <button>Get Started</button>
  </div>
</section>

<!-- About -->
<section id="about" class="section">
  <div class="container">
    <h2>About Us</h2>
    <p>This is a responsive template for all devices.</p>
  </div>
</section>

<!-- Services -->
<section id="services" class="section">
  <div class="container grid">
    <div class="card">Service 1</div>
    <div class="card">Service 2</div>
    <div class="card">Service 3</div>
  </div>
</section>

<!-- Contact -->
<section id="contact" class="section">
  <div class="container">
    <h2>Contact</h2>
    <form>
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Message"></textarea>
      <button>Send</button>
    </form>
  </div>
</section>

<!-- Footer -->
<footer class="footer">
  <p>© 2026 MySite. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
