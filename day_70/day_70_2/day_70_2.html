<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structured Layout</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <section class="part1">

    <!-- Row 1 -->
    <div class="container container1">
      <article class="box box1">1</article>
      <article class="box box2">2</article>
    </div>

    <!-- Row 2 -->
    <div class="container container2">
      <article class="box box3">3</article>
      <article class="box box4">4</article>
      <article class="box box5">5</article>
    </div>

    <!-- Row 3 -->
    <div class="container container3">
      <article class="box box6">6</article>
    </div>

    <!-- Row 4 -->
    <div class="container container4">
      <article class="box box7">7</article>
      <article class="box box8">8</article>
    </div>

  </section>
</body>

</html>
