<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Structure</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <section class="part1">

    <!-- Container 1 -->
    <div class="container container1">
      <article class="box box1"></article>
      <article class="box box2"></article>
    </div>

    <!-- Container 2 -->
    <div class="container container2">
      <article class="box box3"></article>
      <article class="box box4"></article>
      <article class="box box5"></article>
    </div>

    <!-- Single Box -->
    <div class="container container-single">
      <article class="box box6"></article>
    </div>

    <!-- Container 3 -->
    <div class="container container3">
      <article class="box box7"></article>
      <article class="box box8"></article>
    </div>

  </section>
</body>

</html>
