<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>


    <!-- create a calculator -->


    <main>
        <div class="container">

            <input type="text" id="display" value="0">

            <table>
                <tr>
                    <td><button  onclick="DELETE()">AC</button></td>
                    <td><button onclick="CLEAR()">DE</button></td>
                    <td><button onclick="DOT()">.</button></td>
                    <td><button onclick="DIVIDE()">/</button></td>

                </tr>
                <tr>
                    <td><button onclick="btn7()">7</button> </td>
                    <td><button onclick="btn8()">8</button> </td>
                    <td><button onclick="btn9()">9</button> </td>
                    <td><button onclick="MULTIPLY()">*</button> </td>

                </tr>
                <tr>
                    <td><button onclick="btn4()">4</button></td>
                    <td><button onclick="btn5()">5</button></td>
                    <td><button onclick="btn6()">6</button></td>
                    <td><button onclick="MINUS()">-</button></td>
                </tr>
                <tr>
                    <td><button onclick="btn1()">1</button> </td>
                    <td><button onclick="btn2()">2</button> </td>
                    <td><button onclick="btn3()">3</button> </td>
                    <td><button onclick="ADD()">+</button> </td>
                </tr>
                <tr>
                    <td><button>%</button></td>
                    <td><button>0</button></td>
                    <td><button onclick="EQUAL()">=</button></td>
                </tr>
            </table>


        </div>



        <div id="box1" onclick="emoji()">
           😊
        </div>





    </main>






    <script src="./script.js"></script>
</body>

</html>
