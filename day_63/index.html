<body>
    <!-- table tag = used to create table
    childeren of table tag = tr , th , td
    
    tr = table row
    th = table header
    td = table data


    attribute of table tag = border , cellspacing , cellpadding


    ? cellspacing, cellpadding can be used to add space between cells 
    and can only be used with table tag we cannot use it with tr tag , th tag , td tag

    attribute of th , td tag = rowspan , colspan 
    but we cant use it with table tag and tr tag it can be used with th tag and td tag
    -->


    <table  border="2" cellspacing="5"   cellpadding="5">
        <caption>Employee</caption>
        <tr   >
